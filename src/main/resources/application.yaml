spring:
  application:
    name: picardcodingproject
  datasource:
    url: jdbc:postgresql://localhost:5432/picarddb
    username: picard
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    open-in-view: false

  server:
    port: 8080

  app:
    offer-generation:
      fixed-delay: 3000
      initial-delay: 1000

